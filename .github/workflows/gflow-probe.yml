name: gflow-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.DATA_TOKEN }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      AG_KEY: ${{ secrets.AG_KEY }}
      VAULT_DIR: ${{ github.workspace }}/.vault
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fruitcusp/house-data
          token: ${{ secrets.DATA_TOKEN }}
          path: .vault
      - name: Probe Flow session
        timeout-minutes: 40
        run: bash .vault/brain/pipelines/gflow-probe.sh
