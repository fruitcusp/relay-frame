name: ag-task
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Optional queue task id"
        required: false
        default: ""
        type: string
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fruitcusp/house-data
          token: ${{ secrets.DATA_TOKEN }}
          path: .vault
      - name: Run AG task
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          AG_KEY: ${{ secrets.AG_KEY }}
          TASK_ID: ${{ inputs.task_id }}
        run: bash .vault/brain/pipelines/ag-task-run.sh
