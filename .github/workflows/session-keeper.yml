name: session-keeper
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch keeper script from vault and run
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$DATA_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/fruitcusp/house-data.git .vault
          git -C .vault sparse-checkout set brain/pipelines
          bash .vault/brain/pipelines/ag-keeper.sh
