name: session-keeper
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch keeper script from vault
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$DATA_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" clone -q --depth 1 --filter=blob:none --sparse https://github.com/fruitcusp/house-data.git .vault
          git -C .vault sparse-checkout set brain/pipelines
      - name: Keep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .vault/brain/pipelines/ag-keeper.sh
