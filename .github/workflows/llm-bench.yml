name: llm-bench
on:
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.DATA_TOKEN }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      VAULT_DIR: ${{ github.workspace }}/.vault
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fruitcusp/house-data
          token: ${{ secrets.DATA_TOKEN }}
          path: .vault
      - name: Run bench (logic in vault)
        timeout-minutes: 170
        run: bash .vault/brain/pipelines/llm-bench.sh
