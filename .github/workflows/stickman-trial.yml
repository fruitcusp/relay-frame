name: stickman-trial
on:
  workflow_dispatch:
    inputs:
      script_text:
        description: 'Narration script (empty = built-in Vietnamese sample)'
        required: false
        default: ''
        type: string
      style:
        description: 'Code Engine style'
        required: false
        default: 'B6'
        type: choice
        options:
          - B6
          - B2
          - B1
      job_id:
        description: 'TuTaLab job id (optional, for site tracking)'
        required: false
        default: ''
        type: string
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.DATA_TOKEN }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      AG_KEY: ${{ secrets.AG_KEY }}
      VAULT_DIR: ${{ github.workspace }}/.vault
      RUN_ID: ${{ github.run_id }}
      STICK_STYLE: ${{ inputs.style }}
      STICK_RATIO: '9:16'
      STICK_SCRIPT: ${{ inputs.script_text }}
      STICK_JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fruitcusp/house-data
          token: ${{ secrets.DATA_TOKEN }}
          path: .vault
      - name: Setup and voice
        timeout-minutes: 30
        run: bash .vault/brain/pipelines/stickman-run.sh setup
      - name: AG round 1 (author + draft)
        timeout-minutes: 100
        run: bash .vault/brain/pipelines/stickman-run.sh round1
      - name: AG round 2 (fix + review + render)
        timeout-minutes: 100
        run: bash .vault/brain/pipelines/stickman-run.sh round2
      - name: Publish to vault
        timeout-minutes: 15
        run: bash .vault/brain/pipelines/stickman-run.sh publish
